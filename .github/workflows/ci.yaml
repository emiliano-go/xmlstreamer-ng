name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly longer fuzz campaign (Mondays, 04:17 UTC).
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range (requires-python >=3.11).
        python-version: ["3.11", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The parsing engine is a Rust extension built on rypipe-core.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run test suite (Python ${{ matrix.python-version }})
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Ruff (unused imports and variables)
        run: uvx ruff check --select F401,F811,F841 xmlstreamer_ng/ tests/

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path native/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings

  deny:
    name: Supply chain audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check advisories, licenses, and bans
        run: cargo deny --manifest-path native/Cargo.toml check advisories licenses bans

  overflow-checks:
    name: Tests under overflow checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Build the engine with arithmetic overflow checks on, then run the whole
      # suite against it, so integer overflow on crafted input fails CI instead
      # of wrapping silently in the release build.
      - name: Build the extension with overflow checks
        run: |
          uv sync
          RUSTFLAGS="-C overflow-checks=on" uvx maturin develop --release --manifest-path native/Cargo.toml

      - name: Run the suite
        run: uv run --no-sync pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The release workflow builds the same way: a packaging mistake
      # (a missing file, a version that will not resolve) surfaces on
      # every push instead of on the tag that was meant to ship.
      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test the wheel
        run: |
          cd "$(mktemp -d)"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl \
            python -c "import xmlstreamer_ng; print(xmlstreamer_ng.__version__)"

      - name: Smoke test the source distribution
        run: |
          cd "$(mktemp -d)"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.tar.gz \
            python -c "import xmlstreamer_ng; print(xmlstreamer_ng.__version__)"

  wheels:
    # abi3-py310: one wheel per platform covers Python 3.10+.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path native/Cargo.toml
          manylinux: auto

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Smoke test the wheel
        shell: bash
        run: |
          cd "$(mktemp -d)"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl \
            python -c "import xmlstreamer_ng; print(xmlstreamer_ng.__version__)"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Smoke only: shared runners make timing numbers meaningless, so
      # this proves the harness runs end to end, never asserts speed.
      - name: Benchmark harness smoke run
        run: uv run --group bench python benchmarks/run_all.py --quick

  fuzz-smoke:
    runs-on: ubuntu-latest
    needs: rust-lint
    defaults:
      run:
        working-directory: native
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly and cargo-fuzz
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked

      - name: Run all fuzz targets
        run: |
          mkdir -p fuzz/artifacts
          for target in fuzz_parse_document fuzz_columnar fuzz_tokenizer; do
            mkdir -p "fuzz/corpus/$target"
            find fuzz/seeds -type f -exec cp -n {} "fuzz/corpus/$target/" \;
          done
          for target in fuzz_parse_document fuzz_columnar fuzz_tokenizer; do
            mkdir -p "$GITHUB_WORKSPACE/native/fuzz/artifacts/$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -artifact_prefix="$GITHUB_WORKSPACE/native/fuzz/artifacts/$target/"
          done
        env:
          RUST_BACKTRACE: 1

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-smoke-artifacts
          path: native/fuzz/artifacts

  fuzz-long:
    name: Scheduled fuzz campaign
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: rust-lint
    defaults:
      run:
        working-directory: native
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly and cargo-fuzz
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked

      - name: Restore persistent corpora
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: native/fuzz/corpus
          key: fuzz-corpus-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ github.ref_name }}-

      - name: Run longer campaigns
        run: |
          mkdir -p fuzz/artifacts
          for target in fuzz_parse_document fuzz_columnar fuzz_tokenizer; do
            mkdir -p "fuzz/corpus/$target"
            find fuzz/seeds -type f -exec cp -n {} "fuzz/corpus/$target/" \;
          done
          for target in fuzz_parse_document fuzz_columnar fuzz_tokenizer; do
            mkdir -p "$GITHUB_WORKSPACE/native/fuzz/artifacts/$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=600 -artifact_prefix="$GITHUB_WORKSPACE/native/fuzz/artifacts/$target/"
          done

      - name: Upload campaign artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-long-artifacts
          path: native/fuzz/artifacts
