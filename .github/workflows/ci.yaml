name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range (requires-python >=3.11).
        python-version: ["3.11", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The parsing engine is a Rust extension built on rypipe-core.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run test suite (Python ${{ matrix.python-version }})
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Ruff (unused imports and variables)
        run: uvx ruff check --select F401,F811,F841 xmlstreamer_ng/ tests/

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The release workflow builds the same way: a packaging mistake
      # (a missing file, a version that will not resolve) surfaces on
      # every push instead of on the tag that was meant to ship.
      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test the wheel
        run: >
          uv run --isolated --no-project --with dist/*.whl
          python -c "import xmlstreamer_ng; print(xmlstreamer_ng.__version__)"

      - name: Smoke test the source distribution
        run: >
          uv run --isolated --no-project --with dist/*.tar.gz
          python -c "import xmlstreamer_ng; print(xmlstreamer_ng.__version__)"

  wheels:
    # abi3-py310: one wheel per platform covers Python 3.10+.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path native/Cargo.toml
          manylinux: auto

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Smoke test the wheel
        shell: bash
        run: >
          uv run --isolated --no-project --with dist/*.whl
          python -c "import xmlstreamer_ng; print(xmlstreamer_ng.__version__)"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Smoke only: shared runners make timing numbers meaningless, so
      # this proves the harness runs end to end, never asserts speed.
      - name: Benchmark harness smoke run
        run: uv run --group bench python benchmarks/run_all.py --quick
