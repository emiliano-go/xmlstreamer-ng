[package]
name = "xmlstreamer-native"
version = "1.1.0"
edition = "2021"
description = "Rust parsing engine (built on rypipe-core) behind the xmlstreamer-ng Python package"
license = "MIT"
repository = "https://github.com/emiliano-go/xmlstreamer-ng"
homepage = "https://github.com/emiliano-go/xmlstreamer-ng"
exclude = [".cargo"]

[lib]
name = "_xmlstreamer"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
# Both crates come from crates.io so the crate stays publishable: published
# rypipe-python depends on rypipe-core by version, so a single copy of
# rypipe-core is compiled and the Splitter/RecordParser traits unify.
rypipe-core = { version = "0.5.1", features = ["mmap", "compress-all", "streaming-parser", "mimalloc"] }
rypipe_python = { package = "rypipe-python", version = "0.5.1" }
memchr = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
